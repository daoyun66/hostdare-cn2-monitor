name: HostDare CN2 GIA Deal Monitor

"on":
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: hostdare-cn2-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check HostDare
        id: check
        shell: bash
        run: |
          set +e
          python monitor.py
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Save state
        shell: bash
        run: |
          MONTH="$(date -u +%Y-%m)"
          [ -f .heartbeat ] && [ "$(cat .heartbeat)" = "$MONTH" ] || printf "%s\n" "$MONTH" > .heartbeat
          if ! git diff --quiet -- state.json .heartbeat; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json .heartbeat
            git commit -m "chore: update monitor state [skip ci]"
            git push
          fi
      - name: Trigger email notification
        if: steps.check.outputs.code == '42'
        run: |
          echo "::error title=HostDare CN2 GIA DEAL FOUND::New >=30% deal or CSSD1/CAMD1 restock detected."
          exit 1
      - name: Summary
        if: always()
        run: |
          echo "## HostDare CN2 GIA Monitor" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: >=30% CN2 GIA promotion OR CSSD1/CAMD1 restock" >> "$GITHUB_STEP_SUMMARY"
          [ -f last_check.json ] && { echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat last_check.json >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; }

