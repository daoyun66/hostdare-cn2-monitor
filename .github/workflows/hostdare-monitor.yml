name: CN2 GIA Multi-Provider Deal Monitor

"on":
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cn2-gia-multi-provider-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: "HostDare + DMIT + BandwagonHost"
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check CN2 GIA deals
        id: check
        shell: bash
        run: |
          set +e
          python monitor.py
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist monitor state
        shell: bash
        run: |
          MONTH="$(date -u +%Y-%m)"
          if [ ! -f .heartbeat ] || [ "$(cat .heartbeat)" != "$MONTH" ]; then
            printf "%s\n" "$MONTH" > .heartbeat
          fi

          if ! git diff --quiet -- state.json .heartbeat; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json .heartbeat
            git commit -m "chore: update CN2 GIA monitor state [skip ci]"
            git push
          else
            echo "No state change."
          fi

      - name: Trigger GitHub native email alert
        if: steps.check.outputs.code == '42'
        shell: bash
        run: |
          echo "::error title=CN2 GIA DEAL FOUND::A NEW qualifying HostDare / DMIT / BandwagonHost offer was detected. Open the workflow Summary."
          exit 1

      - name: Write monitor summary
        if: always()
        shell: bash
        run: |
          {
            echo "## CN2 GIA Multi-Provider Monitor v2.0.0"
            echo ""
            echo "**Providers:** HostDare + DMIT + BandwagonHost"
            echo ""
            echo "**Hard filter:**"
            echo "- CN2 GIA / CTGNet"
            echo "- RAM >= 1 GB"
            echo "- Dedicated IPv4"
            echo "- Annual price <= \$50"
            echo ""
            echo "- First healthy run creates baseline and never sends a historical alert."
            echo "- Cloudflare / unreadable pages never mean out of stock."
            echo "- Result code: \`${{ steps.check.outputs.code }}\`"
            echo ""
            if [ -f last_check.json ]; then
              echo '```json'
              cat last_check.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
