name: CN2 GIA Multi-Provider Deal Monitor

"on":
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cn2-gia-multi-provider-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: "HostDare + DMIT + BandwagonHost"
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Parser self-test
        run: python monitor.py --self-test

      - name: Check CN2 GIA deals
        id: check
        shell: bash
        run: |
          set +e
          python monitor.py
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist monitor state
        shell: bash
        run: |
          MONTH="$(date -u +%Y-%m)"
          if [ ! -f .heartbeat ] || [ "$(cat .heartbeat)" != "$MONTH" ]; then
            printf "%s\n" "$MONTH" > .heartbeat
          fi

          if ! git diff --quiet -- state.json .heartbeat; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json .heartbeat
            git commit -m "chore: update CN2 GIA monitor state [skip ci]"
            git push
          else
            echo "No state change."
          fi

      - name: Trigger GitHub native email alert
        if: steps.check.outputs.code == '42'
        shell: bash
        run: |
          echo "::error title=CN2 GIA DEAL FOUND::New qualifying offer/candidate detected. Open Summary. VERIFIED = direct official source; CANDIDATE = search fallback pointing to official DMIT."
          exit 1

      - name: Write monitor summary
        if: always()
        shell: bash
        run: |
          {
            echo "## CN2 GIA Multi-Provider Monitor v2.2.0 Stable"
            echo ""
            echo "**Hard filter:** CN2 GIA / CTGNet + RAM >= 1GB + Dedicated IPv4 + annual <= \$50"
            echo ""
            echo "**DMIT fallback chain:** official direct pages -> current promo pages -> Bing RSS discovery pointing only to dmit.io"
            echo ""
            echo "- VERIFIED = direct official source confirms the offer."
            echo "- CANDIDATE = direct DMIT blocked; all hard-filter evidence appears in a search result linking to dmit.io. Open the official URL before purchase."
            echo "- Tier 1 / .T1. is excluded."
            echo "- 403/unreadable never means out of stock."
            echo "- First healthy run creates a baseline."
            echo "- Result code: \`${{ steps.check.outputs.code }}\`"
            echo ""
            if [ -f last_check.json ]; then
              echo '```json'
              cat last_check.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
